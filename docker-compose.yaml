services:
  postgres:
    image: postgres:16-alpine
    container_name: ownid-postgres
    environment:
      POSTGRES_DB: ownid
      POSTGRES_USER: ownid_user
      POSTGRES_PASSWORD: ownid_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./back-end/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownid_user -d ownid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: